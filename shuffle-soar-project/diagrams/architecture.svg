<svg width="680" height="760" viewBox="0 0 680 760" xmlns="http://www.w3.org/2000/svg" role="img">
<title>SOAR pipeline architecture</title>
<desc>Wazuh detects an event, sends a webhook to Shuffle, which enriches the indicator with VirusTotal, scores it, and either contains the threat or logs it, then notifies the SOC.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  text { font-family: Arial, Helvetica, sans-serif; }
  .title { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
  .sub { font-size: 11px; fill: #FFFFFF; opacity: 0.9; }
  .titledark { font-size: 14px; font-weight: 700; fill: #1F2937; }
  .subdark { font-size: 11px; fill: #4B5563; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .label { font-size: 11px; fill: #5F5E5A; }
</style>

<!-- Endpoint -->
<rect x="240" y="20" width="200" height="50" rx="8" fill="#5F5E5A"/>
<text x="340" y="40" text-anchor="middle" class="title">Endpoint / Server</text>
<text x="340" y="58" text-anchor="middle" class="sub">Wazuh agent installed</text>
<line x1="340" y1="70" x2="340" y2="100" class="arr" marker-end="url(#arrow)"/>

<!-- Wazuh Manager -->
<rect x="220" y="100" width="240" height="56" rx="8" fill="#0F6E56"/>
<text x="340" y="122" text-anchor="middle" class="title">Wazuh Manager / SIEM</text>
<text x="340" y="140" text-anchor="middle" class="sub">Correlates logs, fires detection rule</text>
<line x1="340" y1="156" x2="340" y2="186" class="arr" marker-end="url(#arrow)"/>
<text x="350" y="176" class="label">webhook</text>

<!-- Shuffle webhook -->
<rect x="200" y="186" width="280" height="56" rx="8" fill="#185FA5"/>
<text x="340" y="208" text-anchor="middle" class="title">Shuffle SOAR : Webhook</text>
<text x="340" y="226" text-anchor="middle" class="sub">Receives the alert, starts the playbook</text>
<line x1="340" y1="242" x2="340" y2="272" class="arr" marker-end="url(#arrow)"/>

<!-- Parse + Extract -->
<rect x="160" y="272" width="170" height="56" rx="8" fill="#534AB7"/>
<text x="245" y="294" text-anchor="middle" class="title" style="font-size:13px">Parse alert</text>
<text x="245" y="312" text-anchor="middle" class="sub">Extract host, rule ID, IOC fields</text>

<rect x="350" y="272" width="170" height="56" rx="8" fill="#534AB7"/>
<text x="435" y="294" text-anchor="middle" class="title" style="font-size:13px">Extract IOCs</text>
<text x="435" y="312" text-anchor="middle" class="sub">Regex: IP, domain, URL, hash</text>

<line x1="245" y1="328" x2="245" y2="345" class="arr"/>
<line x1="435" y1="328" x2="435" y2="345" class="arr"/>
<line x1="245" y1="345" x2="435" y2="345" class="arr"/>
<line x1="340" y1="345" x2="340" y2="370" class="arr" marker-end="url(#arrow)"/>

<!-- VirusTotal -->
<rect x="190" y="370" width="300" height="56" rx="8" fill="#993C1D"/>
<text x="340" y="392" text-anchor="middle" class="title">VirusTotal lookup</text>
<text x="340" y="410" text-anchor="middle" class="sub">AV engine detections for the indicator</text>
<line x1="340" y1="426" x2="340" y2="456" class="arr" marker-end="url(#arrow)"/>

<!-- Threat score -->
<rect x="200" y="456" width="280" height="50" rx="8" fill="#99352B"/>
<text x="340" y="478" text-anchor="middle" class="title" style="font-size:13px">Calculate threat score</text>
<text x="340" y="496" text-anchor="middle" class="sub">positives / total AV engines</text>

<!-- Branch lines -->
<line x1="340" y1="506" x2="340" y2="524" class="arr"/>
<line x1="170" y1="524" x2="510" y2="524" class="arr"/>
<line x1="170" y1="524" x2="170" y2="546" class="arr" marker-end="url(#arrow)"/>
<line x1="510" y1="524" x2="510" y2="546" class="arr" marker-end="url(#arrow)"/>
<text x="170" y="538" text-anchor="middle" class="label">score &gt; threshold</text>
<text x="510" y="538" text-anchor="middle" class="label">score &lt;= threshold</text>

<!-- Contain branch -->
<rect x="60" y="546" width="220" height="80" rx="8" fill="#791F1F"/>
<text x="170" y="568" text-anchor="middle" class="title">Contain</text>
<text x="170" y="585" text-anchor="middle" class="sub">Block IP / domain</text>
<text x="170" y="600" text-anchor="middle" class="sub">Isolate host</text>
<text x="170" y="615" text-anchor="middle" class="sub">Kill process</text>

<!-- Log branch -->
<rect x="400" y="546" width="220" height="80" rx="8" fill="#444441"/>
<text x="510" y="568" text-anchor="middle" class="title">Log only</text>
<text x="510" y="585" text-anchor="middle" class="sub">Write to monitoring log</text>
<text x="510" y="602" text-anchor="middle" class="sub">No action taken</text>

<line x1="170" y1="626" x2="170" y2="650" class="arr"/>
<line x1="170" y1="650" x2="340" y2="650" class="arr" marker-end="url(#arrow)"/>

<!-- Notify -->
<rect x="170" y="664" width="340" height="76" rx="8" fill="#27500A"/>
<text x="340" y="686" text-anchor="middle" class="title">Notify and record</text>
<text x="340" y="703" text-anchor="middle" class="sub">Slack #soc-alerts  +  Email SOC</text>
<text x="340" y="719" text-anchor="middle" class="sub">Case opened in TheHive (IOC attached)</text>
</svg>
