<svg width="680" height="556" viewBox="0 0 680 556" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Playbook 3: brute force attack response</title>
<desc>Wazuh frequency alert on repeated failed logins leads to a VirusTotal IP reputation check, then either auto-blocking the source IP or rate-limiting and continued monitoring, followed by a Slack notification.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    .label { font-size: 11px; fill: #5F5E5A; font-family: Arial, Helvetica, sans-serif; }
  </style>

<rect x="180" y="30" width="320" height="50" rx="8" fill="#0F6E56"/>
<text x="340.0" y="52" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#FFFFFF">Wazuh alert: 5+ failed logins</text>
<text x="340.0" y="70" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">same source IP, short time window</text>
<line x1="340.0" y1="80" x2="340.0" y2="104" class="arr" marker-end="url(#arrow)"/>
<rect x="180" y="104" width="320" height="50" rx="8" fill="#185FA5"/>
<text x="340.0" y="126" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#FFFFFF">Parse alert</text>
<text x="340.0" y="144" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">src_ip, dst_user, attempt_count, protocol</text>
<line x1="340.0" y1="154" x2="340.0" y2="178" class="arr" marker-end="url(#arrow)"/>
<rect x="180" y="178" width="320" height="50" rx="8" fill="#993C1D"/>
<text x="340.0" y="200" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#FFFFFF">VirusTotal IP reputation report</text>
<text x="340.0" y="218" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">community detections, passive DNS history</text>
<line x1="340.0" y1="228" x2="340.0" y2="252" class="arr"/>
<line x1="245.0" y1="252" x2="435.0" y2="252" class="arr"/>
<text x="245.0" y="246" text-anchor="middle" class="label">malicious or high volume</text>
<text x="435.0" y="246" text-anchor="middle" class="label">clean / low volume</text>
<line x1="245.0" y1="252" x2="245.0" y2="268" class="arr" marker-end="url(#arrow)"/>
<line x1="435.0" y1="252" x2="435.0" y2="268" class="arr" marker-end="url(#arrow)"/>
<rect x="170.0" y="268" width="150" height="70" rx="8" fill="#791F1F"/>
<text x="245.0" y="290" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;fill:#FFFFFF">Auto-block IP</text>
<text x="245.0" y="308" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">at firewall, 24h</text>
<rect x="360.0" y="268" width="150" height="70" rx="8" fill="#444441"/>
<text x="435.0" y="290" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;fill:#FFFFFF">Rate-limit</text>
<text x="435.0" y="308" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">continue monitoring</text>
<line x1="245.0" y1="338" x2="245.0" y2="358" class="arr"/>
<line x1="245.0" y1="358" x2="340.0" y2="358" class="arr"/>
<line x1="340.0" y1="358" x2="340.0" y2="378" class="arr" marker-end="url(#arrow)"/>
<line x1="340.0" y1="378" x2="340.0" y2="402" class="arr" marker-end="url(#arrow)"/>
<rect x="180" y="402" width="320" height="50" rx="8" fill="#99352B"/>
<text x="340.0" y="424" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#FFFFFF">Sync to Wazuh active-response</text>
<text x="340.0" y="442" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">host-level firewall stays consistent</text>
<line x1="340.0" y1="452" x2="340.0" y2="476" class="arr" marker-end="url(#arrow)"/>
<rect x="180" y="476" width="320" height="50" rx="8" fill="#27500A"/>
<text x="340.0" y="498" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#FFFFFF">Slack #soc-alerts</text>
<text x="340.0" y="516" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">source IP, target user, attempt count, VT reputation</text>
</svg>