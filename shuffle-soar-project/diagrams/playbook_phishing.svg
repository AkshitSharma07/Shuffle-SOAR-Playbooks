<svg width="680" height="644" viewBox="0 0 680 644" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Playbook 1: phishing email response</title>
<desc>Wazuh phishing alert leads to IOC extraction, VirusTotal URL and domain checks, a threat score, then either blocking the domain and source IP or logging for monitoring, followed by Slack and email notification.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    .label { font-size: 11px; fill: #5F5E5A; font-family: Arial, Helvetica, sans-serif; }
  </style>

<rect x="180" y="30" width="320" height="50" rx="8" fill="#0F6E56"/>
<text x="340.0" y="52" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#FFFFFF">Wazuh alert: phishing rule fires</text>
<text x="340.0" y="70" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">Rule IDs 31101 / 31103 / 31530</text>
<line x1="340.0" y1="80" x2="340.0" y2="104" class="arr" marker-end="url(#arrow)"/>
<rect x="180" y="104" width="320" height="50" rx="8" fill="#185FA5"/>
<text x="340.0" y="126" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#FFFFFF">Parse Wazuh alert</text>
<text x="340.0" y="144" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">rule_id, src_ip, url, dst_user, hostname</text>
<line x1="340.0" y1="154" x2="340.0" y2="178" class="arr" marker-end="url(#arrow)"/>
<rect x="180" y="178" width="320" height="50" rx="8" fill="#534AB7"/>
<text x="340.0" y="200" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#FFFFFF">Extract IOCs (regex)</text>
<text x="340.0" y="218" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">url / domain / ip</text>
<line x1="340.0" y1="228" x2="340.0" y2="252" class="arr" marker-end="url(#arrow)"/>
<rect x="180" y="252" width="320" height="50" rx="8" fill="#993C1D"/>
<text x="340.0" y="274" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#FFFFFF">VirusTotal URL + domain report</text>
<text x="340.0" y="292" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">positives / total AV engines</text>
<line x1="340.0" y1="302" x2="340.0" y2="326" class="arr" marker-end="url(#arrow)"/>
<rect x="180" y="326" width="320" height="50" rx="8" fill="#99352B"/>
<text x="340.0" y="348" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#FFFFFF">Calculate threat score</text>
<text x="340.0" y="366" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">(positives / total) x 100</text>
<line x1="340.0" y1="376" x2="340.0" y2="400" class="arr"/>
<line x1="245.0" y1="400" x2="435.0" y2="400" class="arr"/>
<text x="245.0" y="394" text-anchor="middle" class="label">score &gt; 5</text>
<text x="435.0" y="394" text-anchor="middle" class="label">score &lt;= 5</text>
<line x1="245.0" y1="400" x2="245.0" y2="416" class="arr" marker-end="url(#arrow)"/>
<line x1="435.0" y1="400" x2="435.0" y2="416" class="arr" marker-end="url(#arrow)"/>
<rect x="170.0" y="416" width="150" height="70" rx="8" fill="#791F1F"/>
<text x="245.0" y="438" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;fill:#FFFFFF">Block domain</text>
<text x="245.0" y="456" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">+ block source IP</text>
<rect x="360.0" y="416" width="150" height="70" rx="8" fill="#444441"/>
<text x="435.0" y="438" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;fill:#FFFFFF">Log &amp; monitor</text>
<text x="435.0" y="456" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">no block taken</text>
<line x1="245.0" y1="486" x2="245.0" y2="506" class="arr"/>
<line x1="245.0" y1="506" x2="340.0" y2="506" class="arr"/>
<line x1="340.0" y1="506" x2="340.0" y2="526" class="arr" marker-end="url(#arrow)"/>
<line x1="340.0" y1="526" x2="340.0" y2="550" class="arr" marker-end="url(#arrow)"/>
<rect x="180" y="550" width="320" height="64" rx="8" fill="#27500A"/>
<text x="340.0" y="572" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#FFFFFF">Notify and sync</text>
<text x="340.0" y="590" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">Slack #soc-alerts + Email SOC</text>
<text x="340.0" y="606" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">Wazuh active-response update</text>
</svg>