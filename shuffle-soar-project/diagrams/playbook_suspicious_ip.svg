<svg width="680" height="516" viewBox="0 0 680 516" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Playbook 4: suspicious IP enrichment</title>
<desc>An outbound connection to an unrecognized IP triggers GeoIP and VirusTotal lookups, a composite threat score, then either a conditional block or logging the enrichment to a dashboard for analyst review.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    .label { font-size: 11px; fill: #5F5E5A; font-family: Arial, Helvetica, sans-serif; }
  </style>

<rect x="180" y="30" width="320" height="50" rx="8" fill="#0F6E56"/>
<text x="340.0" y="52" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#FFFFFF">Wazuh alert: outbound connection</text>
<text x="340.0" y="70" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">destination IP not on allow-list</text>
<line x1="340.0" y1="80" x2="340.0" y2="104" class="arr" marker-end="url(#arrow)"/>
<rect x="180" y="104" width="320" height="50" rx="8" fill="#185FA5"/>
<text x="340.0" y="126" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#FFFFFF">Parse alert</text>
<text x="340.0" y="144" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">dest_ip, src_host, dest_port, process_name</text>
<line x1="340.0" y1="154" x2="340.0" y2="178" class="arr" marker-end="url(#arrow)"/>
<rect x="180" y="178" width="320" height="50" rx="8" fill="#534AB7"/>
<text x="340.0" y="200" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#FFFFFF">GeoIP lookup</text>
<text x="340.0" y="218" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">country, ASN, hosting provider</text>
<line x1="340.0" y1="228" x2="340.0" y2="252" class="arr" marker-end="url(#arrow)"/>
<rect x="180" y="252" width="320" height="50" rx="8" fill="#993C1D"/>
<text x="340.0" y="274" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#FFFFFF">VirusTotal IP scan</text>
<text x="340.0" y="292" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">detections, passive DNS, related samples</text>
<line x1="340.0" y1="302" x2="340.0" y2="326" class="arr" marker-end="url(#arrow)"/>
<rect x="180" y="326" width="320" height="50" rx="8" fill="#99352B"/>
<text x="340.0" y="348" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#FFFFFF">Composite threat scoring</text>
<text x="340.0" y="366" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">GeoIP risk + VT detection count</text>
<line x1="340.0" y1="376" x2="340.0" y2="400" class="arr"/>
<line x1="245.0" y1="400" x2="435.0" y2="400" class="arr"/>
<text x="245.0" y="394" text-anchor="middle" class="label">score &gt; 40</text>
<text x="435.0" y="394" text-anchor="middle" class="label">score &lt;= 40</text>
<line x1="245.0" y1="400" x2="245.0" y2="416" class="arr" marker-end="url(#arrow)"/>
<line x1="435.0" y1="400" x2="435.0" y2="416" class="arr" marker-end="url(#arrow)"/>
<rect x="170.0" y="416" width="150" height="70" rx="8" fill="#791F1F"/>
<text x="245.0" y="438" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;fill:#FFFFFF">Conditional block</text>
<text x="245.0" y="456" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">outbound traffic</text>
<rect x="360.0" y="416" width="150" height="70" rx="8" fill="#444441"/>
<text x="435.0" y="438" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;fill:#FFFFFF">Log to dashboard</text>
<text x="435.0" y="456" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#FFFFFF;opacity:0.92">full enrichment kept</text>
</svg>